[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitest-platform"
version = "0.2.0"
description = "T01+T03 skeleton: model, permissions, evidence/redaction/retention and report snapshots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aitest = "aitest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aitest = ["migrations/*.sql"]
