[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitest-platform"
version = "0.3.0"
description = "Internal AI automation test platform skeleton (T01 + T08 + T09)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aitest = "aitest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aitest = ["migrations/*.sql"]
